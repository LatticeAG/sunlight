[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunlight-ledger"
version = "1.0.0"
description = "Sunlight v1 — sign-at-creation provenance SDK, CLI, and offline verifier (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=41"]

[project.scripts]
sunlight-py = "sunlight.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
